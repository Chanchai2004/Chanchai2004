name: Profile animations

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ponytail: one graph per year (tool only supports a single year); "now" = current year,
      # so when the year rolls over add the finished year as its own step + README row.
      - run: echo "THIS_YEAR=$(date +%Y)" >> "$GITHUB_ENV"

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}", USERNAME: "${{ github.repository_owner }}", YEAR: "2024" }
      - run: mkdir -p dist && mv profile-3d-contrib dist/3d-2024

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}", USERNAME: "${{ github.repository_owner }}", YEAR: "2025" }
      - run: mv profile-3d-contrib dist/3d-2025

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}", USERNAME: "${{ github.repository_owner }}", YEAR: "${{ env.THIS_YEAR }}" }
      - run: mv profile-3d-contrib dist/3d-now

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
